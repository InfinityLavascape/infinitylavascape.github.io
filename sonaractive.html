<!DOCTYPE html>
<html>
<head>
  <title>Sonaractive</title>
</head>
<body style="background-color:black; color:black">
    <!-- Text area at the center of the screen -->
    <textarea placeholder="Enter username here..." style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 20px;"></textarea>
    <!-- A button below to confirm -->
    <button style="position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);">Enter</button>

    <script>
      const apiBase = "https://sonaractive.jacksonsteven212.workers.dev";
      const input = document.querySelector("textarea");
      const button = document.querySelector("button");
      const loadedAssets = new Map();
      let listening = false;
      let playbackQueue = Promise.resolve();

      function showListening() {
        document.body.innerHTML = '<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white;">Listening...</div>';
      }

      function loadAsset(assetName) {
        if (typeof assetName !== "string" || !/^[\w.-]+\.ogg$/i.test(assetName)) {
          return Promise.reject(new Error(`Invalid Sonaractive asset name: ${assetName}`));
        }

        if (!loadedAssets.has(assetName)) {
          const assetUrl = new URL(`sonaractive/assets/${encodeURIComponent(assetName)}`, document.baseURI);
          const audio = new Audio();
          audio.preload = "auto";
          audio.src = assetUrl;
          loadedAssets.set(assetName, new Promise((resolve, reject) => {
            if (audio.readyState >= HTMLMediaElement.HAVE_FUTURE_DATA) {
              resolve(audio);
              return;
            }
            audio.addEventListener("canplay", () => resolve(audio), { once: true });
            audio.addEventListener("error", () => {
              const mediaError = audio.error;
              const errorNames = {
                1: "aborted",
                2: "network error",
                3: "decode error",
                4: "unsupported format or source"
              };
              const reason = errorNames[mediaError?.code] || "unknown media error";
              reject(new Error(
                `Could not load ${assetName} from ${assetUrl}: ${reason} ` +
                `(media error ${mediaError?.code || "unknown"}); ` +
                `Ogg Vorbis support: ${audio.canPlayType('audio/ogg; codecs="vorbis"') || "not reported"}`
              ));
            }, { once: true });
            audio.load();
          }));
        }

        return loadedAssets.get(assetName);
      }

      function queueSound(assetName) {
        playbackQueue = playbackQueue.then(async () => {
          const template = await loadAsset(assetName);
          const audio = template.cloneNode();
          await audio.play();
        }).catch((error) => {
          console.error("Audio playback error:", error);
        });
      }

      async function preloadAssets() {
        try {
          const response = await fetch(new URL("sonaractive/assets/manifest.json", document.baseURI), {
            cache: "no-cache"
          });
          if (!response.ok) throw new Error(`Asset manifest request failed: ${response.status}`);
          const assets = await response.json();
          if (!Array.isArray(assets)) throw new Error("Asset manifest must contain a list of filenames");

          await Promise.all(assets.map(async (assetName) => {
            try {
              await loadAsset(assetName);
            } catch (error) {
              console.error("Audio preload error:", error);
            }
          }));
        } catch (error) {
          console.error("Asset preload error:", error);
        }
      }

      function delay(milliseconds) {
        return new Promise((resolve) => setTimeout(resolve, milliseconds));
      }

      async function pollQueue(username) {
        while (listening) {
          try {
            const response = await fetch(`${apiBase}/api/sonar/pull?username=${encodeURIComponent(username)}`, {
              cache: "no-store"
            });
            if (!response.ok) throw new Error(`Sound request failed: ${response.status}`);
            const data = await response.json();
            if (data && data.asset) {
              queueSound(data.asset);
            } else {
              await delay(200);
            }
          } catch (error) {
            console.error("Pull error:", error);
            await delay(1000);
          }
        }
      }

      async function registerListener() {
        if (listening) return;
        const username = input.value.trim();
        if (!username) return;

        try {
          const response = await fetch(`${apiBase}/api/sonar/register`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username })
          });
          if (!response.ok) throw new Error(`Registration failed: ${response.status}`);
        } catch (error) {
          console.error("Register error:", error);
          return;
        }

        listening = true;
        showListening();
        void preloadAssets();
        void pollQueue(username);
      }

      button.addEventListener("click", registerListener);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          registerListener();
        }
      });
    </script>
</body>
</html>
