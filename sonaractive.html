<!DOCTYPE html>
<html>
<head>
  <title>Sonaractive</title>
</head>
<body style="background-color:black; color:black">
    <!-- Text area at the center of the screen -->
    <textarea placeholder="Enter username here..." style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 20px;"></textarea>
    <!-- A button below to confirm -->
    <button style="position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);">Enter</button>

    <script>
      const apiBase = "https://sonaractive.jacksonsteven212.workers.dev";
      const input = document.querySelector("textarea");
      const button = document.querySelector("button");
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const loadedAssets = new Map();
      const activeSounds = new Map();
      let listening = false;
      let playbackQueue = Promise.resolve();
      let reconnectDelay = 250;

      function showListening() {
        document.body.innerHTML = '<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white;">Listening...</div>';
      }

      function loadAsset(assetName) {
        if (typeof assetName !== "string" || !/^[\w.-]+\.ogg$/i.test(assetName)) {
          return Promise.reject(new Error(`Invalid Sonaractive asset name: ${assetName}`));
        }

        if (!loadedAssets.has(assetName)) {
          const assetUrl = new URL(`sonaractive/assets/${encodeURIComponent(assetName)}`, document.baseURI);
          const assetPromise = fetch(assetUrl, { cache: "force-cache" })
            .then((response) => {
              if (!response.ok) throw new Error(`Asset request failed: ${response.status} (${assetUrl})`);
              return response.arrayBuffer();
            })
            .then((data) => audioContext.decodeAudioData(data));
          loadedAssets.set(assetName, assetPromise);
          assetPromise.catch(() => {
            if (loadedAssets.get(assetName) === assetPromise) loadedAssets.delete(assetName);
          });
        }

        return loadedAssets.get(assetName);
      }

      function stopSound(playbackId) {
        const sound = activeSounds.get(playbackId);
        if (!sound) return;
        activeSounds.delete(playbackId);
        if (sound.source) {
          const source = sound.source;
          sound.source = null;
          source.stop();
        }
      }

      function startSoundSource(playbackId, sound, offset) {
        const source = audioContext.createBufferSource();
        source.buffer = sound.buffer;
        source.connect(sound.gain);
        sound.source = source;
        sound.offset = offset;
        sound.startedAt = audioContext.currentTime;
        sound.paused = false;
        source.onended = () => {
          if (sound.source === source) activeSounds.delete(playbackId);
        };
        source.start(0, offset);
      }

      async function handleCommand(event) {
        const playbackId = event.playbackId;
        if (typeof playbackId !== "string") {
          console.error("Sound command is missing its playbackId:", event);
          return;
        }

        if (event.command === "play") {
          stopSound(playbackId);
          const buffer = await loadAsset(event.sound || event.asset);
          const gain = audioContext.createGain();
          gain.gain.value = event.volume ?? 1;
          gain.connect(audioContext.destination);
          const sound = { buffer, gain, source: null, offset: 0, startedAt: 0, paused: false };
          activeSounds.set(playbackId, sound);
          startSoundSource(playbackId, sound, 0);
          console.info(
            `Sonaractive started ${event.sound || event.asset}; ` +
            `${Math.round(performance.now() - event.receivedAt)}ms from WebSocket event to start; ` +
            `approximately ${Math.round(Date.now() - event.workerReceivedAt)}ms from Worker to start`
          );
          return;
        }

        const sound = activeSounds.get(playbackId);
        if (!sound) {
          console.warn(`Sonaractive ${event.command} ignored; no active sound ${playbackId}`);
          return;
        }

        if (event.command === "pause" && sound.source) {
          sound.offset = (sound.offset + audioContext.currentTime - sound.startedAt) % sound.buffer.duration;
          const source = sound.source;
          sound.source = null;
          sound.paused = true;
          source.stop();
        } else if (event.command === "resume" && sound.paused) {
          startSoundSource(playbackId, sound, sound.offset);
        } else if (event.command === "stop") {
          stopSound(playbackId);
        } else if (event.command === "volume") {
          const now = audioContext.currentTime;
          const parameter = sound.gain.gain;
          if (typeof parameter.cancelAndHoldAtTime === "function") {
            parameter.cancelAndHoldAtTime(now);
          } else {
            parameter.cancelScheduledValues(now);
            parameter.setValueAtTime(parameter.value, now);
          }
          if (event.mode === "tween") {
            parameter.linearRampToValueAtTime(event.value, now + event.duration);
          } else {
            parameter.setValueAtTime(event.value, now);
          }
        }
      }

      function queueCommand(event) {
        playbackQueue = playbackQueue.then(async () => {
          await audioContext.resume();
          await handleCommand({
            ...event,
            command: event.command || (event.asset ? "play" : undefined),
            sound: event.sound || event.asset,
            receivedAt: performance.now()
          });
        }).catch((error) => {
          console.error("Audio command error:", error);
        });
      }

      async function preloadAssets() {
        try {
          const response = await fetch(new URL("sonaractive/assets/manifest.json", document.baseURI), {
            cache: "no-cache"
          });
          if (!response.ok) throw new Error(`Asset manifest request failed: ${response.status}`);
          const assets = await response.json();
          if (!Array.isArray(assets)) throw new Error("Asset manifest must contain a list of filenames");

          await Promise.all(assets.map(async (assetName) => {
            try {
              await loadAsset(assetName);
            } catch (error) {
              console.error("Audio preload error:", error);
            }
          }));
        } catch (error) {
          console.error("Asset preload error:", error);
        }
      }

      function connectWebSocket(username) {
        if (!listening) return;

        const socketUrl = new URL("/api/sonar/connect", apiBase);
        socketUrl.protocol = socketUrl.protocol === "https:" ? "wss:" : "ws:";
        socketUrl.searchParams.set("username", username);

        const socket = new WebSocket(socketUrl);
        socket.addEventListener("open", () => {
          reconnectDelay = 250;
          console.info("Sonaractive live connection open");
        }, { once: true });
        socket.addEventListener("message", (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data && data.command) {
              queueCommand({
                ...data,
                playbackId: data.playbackId || crypto.randomUUID(),
                workerReceivedAt: data.workerReceivedAt || Date.now()
              });
            }
            else if (data && data.asset) {
              queueCommand({
                ...data,
                command: "play",
                playbackId: data.playbackId || crypto.randomUUID(),
                sound: data.asset
              });
            } else {
              console.error("Invalid sound event received:", data);
            }
          } catch (error) {
            console.error("Could not process sound event:", error);
          }
        });
        socket.addEventListener("close", () => {
          if (!listening) return;
          const delay = reconnectDelay;
          reconnectDelay = Math.min(reconnectDelay * 2, 5000);
          setTimeout(() => connectWebSocket(username), delay);
        }, { once: true });
        socket.addEventListener("error", () => socket.close(), { once: true });
      }

      function registerListener() {
        if (listening) return;
        const username = input.value.trim();
        if (!username) return;

        listening = true;
        void audioContext.resume().catch((error) => {
          console.error("Could not start audio context:", error);
        });
        showListening();
        connectWebSocket(username);
      }

      void preloadAssets();
      button.addEventListener("click", registerListener);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          registerListener();
        }
      });
    </script>
</body>
</html>
