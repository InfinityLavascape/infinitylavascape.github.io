<!DOCTYPE html>
<html>
<head>
  <title>Sonaractive</title>
</head>
<body style="background-color:black; color:black">
    <!-- Text area at the center of the screen -->
    <textarea placeholder="Enter username here..." style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 200px; height: 20px;"></textarea>
    <!-- A button below to confirm -->
    <button style="position: absolute; top: 55%; left: 50%; transform: translate(-50%, -50%);">Enter</button>

    <script>
      const apiBase = "https://sonaractive.jacksonsteven212.workers.dev";
      const input = document.querySelector("textarea");
      const button = document.querySelector("button");
      const audioContext = new (window.AudioContext || window.webkitAudioContext)();
      const loadedAssets = new Map();
      let listening = false;
      let playbackQueue = Promise.resolve();
      let reconnectDelay = 250;

      function showListening() {
        document.body.innerHTML = '<div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; color: white;">Listening...</div>';
      }

      function loadAsset(assetName) {
        if (typeof assetName !== "string" || !/^[\w.-]+\.ogg$/i.test(assetName)) {
          return Promise.reject(new Error(`Invalid Sonaractive asset name: ${assetName}`));
        }

        if (!loadedAssets.has(assetName)) {
          const assetUrl = new URL(`sonaractive/assets/${encodeURIComponent(assetName)}`, document.baseURI);
          const assetPromise = fetch(assetUrl, { cache: "force-cache" })
            .then((response) => {
              if (!response.ok) throw new Error(`Asset request failed: ${response.status} (${assetUrl})`);
              return response.arrayBuffer();
            })
            .then((data) => audioContext.decodeAudioData(data));
          loadedAssets.set(assetName, assetPromise);
          assetPromise.catch(() => {
            if (loadedAssets.get(assetName) === assetPromise) loadedAssets.delete(assetName);
          });
        }

        return loadedAssets.get(assetName);
      }

      function queueSound(event) {
        playbackQueue = playbackQueue.then(async () => {
          await audioContext.resume();
          const buffer = await loadAsset(event.asset);
          const source = audioContext.createBufferSource();
          source.buffer = buffer;
          source.connect(audioContext.destination);
          source.start();
          console.info(
            `Sonaractive started ${event.asset}; ` +
            `${Math.round(performance.now() - event.receivedAt)}ms from WebSocket event to start; ` +
            `approximately ${Math.round(Date.now() - event.workerReceivedAt)}ms from Worker to start`
          );
        }).catch((error) => {
          console.error("Audio playback error:", error);
        });
      }

      async function preloadAssets() {
        try {
          const response = await fetch(new URL("sonaractive/assets/manifest.json", document.baseURI), {
            cache: "no-cache"
          });
          if (!response.ok) throw new Error(`Asset manifest request failed: ${response.status}`);
          const assets = await response.json();
          if (!Array.isArray(assets)) throw new Error("Asset manifest must contain a list of filenames");

          await Promise.all(assets.map(async (assetName) => {
            try {
              await loadAsset(assetName);
            } catch (error) {
              console.error("Audio preload error:", error);
            }
          }));
        } catch (error) {
          console.error("Asset preload error:", error);
        }
      }

      function connectWebSocket(username) {
        if (!listening) return;

        const socketUrl = new URL("/api/sonar/connect", apiBase);
        socketUrl.protocol = socketUrl.protocol === "https:" ? "wss:" : "ws:";
        socketUrl.searchParams.set("username", username);

        const socket = new WebSocket(socketUrl);
        socket.addEventListener("open", () => {
          reconnectDelay = 250;
          console.info("Sonaractive live connection open");
        }, { once: true });
        socket.addEventListener("message", (event) => {
          try {
            const data = JSON.parse(event.data);
            if (data && data.asset) {
              queueSound({
                asset: data.asset,
                receivedAt: performance.now(),
                workerReceivedAt: data.workerReceivedAt || Date.now()
              });
            }
            else console.error("Invalid sound event received:", data);
          } catch (error) {
            console.error("Could not process sound event:", error);
          }
        });
        socket.addEventListener("close", () => {
          if (!listening) return;
          const delay = reconnectDelay;
          reconnectDelay = Math.min(reconnectDelay * 2, 5000);
          setTimeout(() => connectWebSocket(username), delay);
        }, { once: true });
        socket.addEventListener("error", () => socket.close(), { once: true });
      }

      function registerListener() {
        if (listening) return;
        const username = input.value.trim();
        if (!username) return;

        listening = true;
        void audioContext.resume().catch((error) => {
          console.error("Could not start audio context:", error);
        });
        showListening();
        connectWebSocket(username);
      }

      void preloadAssets();
      button.addEventListener("click", registerListener);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          registerListener();
        }
      });
    </script>
</body>
</html>
